# Models available to `lceval.py run --model <name>`.
#
# rates: USD per million tokens (input, output, cache_read, cache_write). They drive the cost
# estimate, the running cost display, and the --max-cost guard; a model without rates can
# only run with --allow-unpriced. Anthropic rates checked 2026-10-11 against
# https://platform.claude.com/docs/en/about-claude/pricing ; fill in the others from each
# provider's pricing page.
#
# model_id = "TODO" blocks a model from running until you set its exact API string.

# effort: the reasoning level every call for this model uses (overridable with --effort).
# Nominal level is medium. GLM, Kimi and DeepSeek have no medium (low/high/max only), so
# they run at high, the nearest level that keeps reasoning substantial. Grok: if the API
# rejects reasoning_effort, the adapter drops it and the model default applies (check
# `dropped_params` at the end of the first run). State these per-vendor settings in any write-up.

[models.claude-fable-5-1]
provider = "anthropic"
model_id = "claude-fable-5-1"
effort = "medium"
rates = { input = 10.0, output = 50.0, cache_read = 0.25, cache_write = 12.5 }

[models.claude-opus-5-5]
provider = "anthropic"
model_id = "claude-opus-5-5"
effort = "medium"
rates = { input = 4.0, output = 20.0, cache_read = 0.20, cache_write = 5.0 }

[models.claude-sonnet-5-5]
provider = "anthropic"
model_id = "claude-sonnet-5-5"
effort = "medium"
rates = { input = 2.0, output = 10.0, cache_read = 0.10, cache_write = 2.5 }

[models.claude-haiku-5-5]
provider = "anthropic"
model_id = "claude-haiku-5-5"
effort = "medium"
